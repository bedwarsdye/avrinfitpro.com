    <style>
        /* CSS to mimic the GitHub layout */
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif;
            background-color: #ffffff;
            color: #24292f;
            margin: 0;
            padding: 40px;
            display: flex;
            justify-content: center;
        }
        .repo-box {
            width: 100%; max-width: 900px;
            border: 1px solid #d0d7de; border-radius: 6px;
            overflow: hidden; cursor: pointer;
        }
        .repo-header {
            background-color: #f6f8fa; padding: 16px;
            display: flex; justify-content: space-between;
            border-bottom: 1px solid #d0d7de; font-size: 14px;
        }
        .header-left, .header-right { display: flex; align-items: center; gap: 8px; }
        .avatar { width: 24px; height: 24px; border-radius: 50%; }
        .username, .checkmark { font-weight: 600; }
        .checkmark { color: #1a7f37; }
        .commit-msg, .header-right { color: #57606a; }
        .file-row {
            display: flex; align-items: center; padding: 8px 16px;
            border-bottom: 1px solid #d0d7de; font-size: 14px;
        }
        .file-row:last-child { border-bottom: none; }
        .file-row:hover { background-color: #f6f8fa; }
        .file-icon { margin-right: 16px; fill: #57606a; width: 16px; height: 16px; }
        .file-name { flex: 1; color: #24292f; }
        .file-commit { flex: 2; color: #57606a; }
        .file-time { color: #57606a; text-align: right; width: 120px; }
        
        /* Video styling - initially hidden */
        #prankVideo {
            display: none; position: fixed; top: 0; left: 0;
            width: 100vw; height: 100vh; background-color: black;
            z-index: 9999; object-fit: cover;
        }
    </style>
    
    <script>
        // We put the logic here to avoid the Middleware Error
        document.addEventListener('DOMContentLoaded', () => {
            document.body.addEventListener('click', function() {
                const ui = document.getElementById('fakeUI');
                const video = document.getElementById('prankVideo');
                
                if (ui && video) {
                    ui.style.display = 'none';
                    video.style.display = 'block';
                    video.play().catch(err => {
                        console.log("Playback failed:", err);
                    });
                }
            }, { once: true });
        });
    </script>
